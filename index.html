<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101710">
  <title>🌼</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@1,600&display=swap');

    :root {
      --background: #101710;
      --card: rgba(248, 241, 215, 0.07);
      --text: #f7f1dc;
      --muted: #c6c4ad;
      --yellow: #f5c84c;
      --yellow-light: #ffe992;
      --brown: #674327;
      --green: #4e8a54;
      --green-dark: #2f603b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(circle at 50% 80%, rgba(73, 126, 69, 0.22), transparent 35%),
        radial-gradient(circle at 20% 15%, rgba(245, 200, 76, 0.08), transparent 25%),
        var(--background);
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.06;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    }

    .card {
      position: relative;
      width: min(92vw, 430px);
      min-height: min(760px, 90svh);
      padding: 34px 28px 30px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      background: var(--card);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .intro {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 35px;
      background: linear-gradient(160deg, #172218, #0e150f);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .intro.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .tiny-flower {
      margin-bottom: 22px;
      font-size: 42px;
      animation: float 2.6s ease-in-out infinite;
    }

    h1 {
      max-width: 300px;
      margin: 0 0 28px;
      font-family: "Playfair Display", serif;
      font-size: clamp(30px, 8vw, 42px);
      font-style: italic;
      line-height: 1.08;
      font-weight: 600;
    }

    button {
      padding: 14px 23px;
      border: 0;
      border-radius: 999px;
      color: #1d241b;
      font: 600 15px "DM Sans", sans-serif;
      background: var(--yellow);
      box-shadow: 0 8px 28px rgba(245, 200, 76, 0.22);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 34px rgba(245, 200, 76, 0.3);
    }

    button:active {
      transform: scale(0.97);
    }

    .scene {
      position: relative;
      width: 250px;
      height: 390px;
      margin-top: -18px;
    }

    .stem {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 10px;
      height: 245px;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--green-dark), var(--green));
      transform: translateX(-50%) scaleY(0);
      transform-origin: bottom;
    }

    .leaf {
      position: absolute;
      bottom: 92px;
      width: 78px;
      height: 42px;
      opacity: 0;
      background: linear-gradient(145deg, var(--green), var(--green-dark));
    }

    .leaf.left {
      left: 47px;
      border-radius: 100% 0 100% 0;
      transform: rotate(24deg) scale(0.2);
      transform-origin: right bottom;
    }

    .leaf.right {
      right: 47px;
      bottom: 142px;
      border-radius: 0 100% 0 100%;
      transform: rotate(-24deg) scale(0.2);
      transform-origin: left bottom;
    }

.flower {
  position: absolute;
  top: 10px;
  left: 50%;
  width: 190px;
  height: 190px;
  opacity: 0;
  transform: translateX(-50%) scale(0.15) rotate(-12deg);
  filter: drop-shadow(0 10px 16px rgba(40, 25, 5, 0.25));
}

.rose-petal {
  position: absolute;
  background: linear-gradient(
    145deg,
    var(--yellow-light) 5%,
    var(--yellow) 58%,
    #dda52a 100%
  );
  box-shadow:
    inset 0 -8px 12px rgba(147, 90, 8, 0.16),
    inset 5px 3px 8px rgba(255, 247, 180, 0.18);
}

/* Pétalos exteriores */

.rose-petal.outer {
  top: 12px;
  left: 60px;
  z-index: 1;
  width: 70px;
  height: 96px;
  border-radius: 55% 45% 58% 42%;
  transform-origin: 35px 84px;
}

.o1 { transform: rotate(0deg); }
.o2 { transform: rotate(45deg); }
.o3 { transform: rotate(90deg); }
.o4 { transform: rotate(135deg); }
.o5 { transform: rotate(180deg); }
.o6 { transform: rotate(225deg); }
.o7 { transform: rotate(270deg); }
.o8 { transform: rotate(315deg); }

/* Pétalos de la parte media */

.rose-petal.middle {
  top: 37px;
  left: 68px;
  z-index: 2;
  width: 54px;
  height: 73px;
  border-radius: 60% 40% 55% 45%;
  transform-origin: 27px 61px;
  background: linear-gradient(
    145deg,
    #ffe998,
    #f5c84c 62%,
    #d79a22
  );
}

.m1 { transform: rotate(30deg); }
.m2 { transform: rotate(90deg); }
.m3 { transform: rotate(150deg); }
.m4 { transform: rotate(210deg); }
.m5 { transform: rotate(270deg); }
.m6 { transform: rotate(330deg); }

/* Pétalos interiores */

.rose-petal.inner {
  top: 60px;
  left: 76px;
  z-index: 3;
  width: 38px;
  height: 52px;
  border-radius: 65% 35% 60% 40%;
  transform-origin: 19px 43px;
  background: linear-gradient(
    145deg,
    #fff1aa,
    #f3bd36 70%,
    #cb8717
  );
}

.i1 { transform: rotate(10deg); }
.i2 { transform: rotate(100deg); }
.i3 { transform: rotate(190deg); }
.i4 { transform: rotate(280deg); }

/* Centro cerrado de la rosa */

.rose-heart {
  position: absolute;
  top: 78px;
  left: 78px;
  z-index: 4;
  width: 34px;
  height: 34px;
  border-radius: 60% 40% 55% 45%;
  background: linear-gradient(
    145deg,
    #ffed94,
    #e9ad29 65%,
    #bd7417
  );
  transform: rotate(35deg);
  box-shadow:
    inset -5px -5px 8px rgba(132, 72, 7, 0.2),
    0 2px 7px rgba(81, 46, 7, 0.2);
}

    .message {
      max-width: 340px;
      margin-top: 22px;
      opacity: 0;
      transform: translateY(18px);
    }

    .message p {
      margin: 0;
      font-size: clamp(18px, 4.8vw, 22px);
      line-height: 1.55;
    }

    .message em {
      color: var(--yellow-light);
      font-family: "Playfair Display", serif;
      font-size: 1.12em;
    }

    .signature {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card.open .stem {
      animation: growStem 1.2s 0.2s cubic-bezier(.17,.67,.35,1) forwards;
    }

    .card.open .leaf.left {
      animation: growLeafLeft 0.7s 1s ease-out forwards;
    }

    .card.open .leaf.right {
      animation: growLeafRight 0.7s 1.2s ease-out forwards;
    }

    .card.open .flower {
      animation: bloom 1.35s 1.15s cubic-bezier(.16,.75,.25,1.25) forwards,
                 sway 4.5s 2.5s ease-in-out infinite;
    }

    .card.open .message {
      animation: reveal 0.9s 2.35s ease forwards;
    }

    @keyframes growStem {
      to { transform: translateX(-50%) scaleY(1); }
    }

    @keyframes growLeafLeft {
      to { opacity: 1; transform: rotate(24deg) scale(1); }
    }

    @keyframes growLeafRight {
      to { opacity: 1; transform: rotate(-24deg) scale(1); }
    }

    @keyframes bloom {
      to { opacity: 1; transform: translateX(-50%) scale(1) rotate(0); }
    }

    @keyframes sway {
      0%, 100% { transform: translateX(-50%) rotate(-1.5deg); }
      50% { transform: translateX(-50%) rotate(1.5deg); }
    }

    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-8px) rotate(4deg); }
    }

    @media (max-height: 700px) {
      .card { min-height: 94svh; padding-block: 20px; }
      .scene { height: 330px; transform: scale(0.84); margin-block: -36px -15px; }
      .message { margin-top: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="grain"></div>

  <main class="card" id="card">
    <section class="intro" id="intro">
      <div class="tiny-flower">🌱</div>
      <h1>Te hice algo pequeño…</h1>
      <button id="openButton" type="button">Ver</button>
    </section>

    <div class="scene" aria-label="Una rosa amarilla animada">
      <div class="stem"></div>
      <div class="leaf left"></div>
      <div class="leaf right"></div>

<div class="flower">
  <!-- Pétalos exteriores -->
  <div class="rose-petal outer o1"></div>
  <div class="rose-petal outer o2"></div>
  <div class="rose-petal outer o3"></div>
  <div class="rose-petal outer o4"></div>
  <div class="rose-petal outer o5"></div>
  <div class="rose-petal outer o6"></div>
  <div class="rose-petal outer o7"></div>
  <div class="rose-petal outer o8"></div>

  <!-- Pétalos medios -->
  <div class="rose-petal middle m1"></div>
  <div class="rose-petal middle m2"></div>
  <div class="rose-petal middle m3"></div>
  <div class="rose-petal middle m4"></div>
  <div class="rose-petal middle m5"></div>
  <div class="rose-petal middle m6"></div>

  <!-- Pétalos interiores -->
  <div class="rose-petal inner i1"></div>
  <div class="rose-petal inner i2"></div>
  <div class="rose-petal inner i3"></div>
  <div class="rose-petal inner i4"></div>

  <div class="rose-heart"></div>
</div>

</div>

    <section class="message">
      <p>
        No sé si ya me gané el derecho de regalarte flores…
        <br>
        pero <em>programarte una</em> me pareció un buen comienzo
      </p>

      <!-- Cambia "Denn" por tu nombre o elimina esta línea. -->
      <div class="signature">~ Denn ~</div>
    </section>
  </main>

  <script>
    const card = document.querySelector("#card");
    const intro = document.querySelector("#intro");
    const openButton = document.querySelector("#openButton");

    openButton.addEventListener("click", () => {
      intro.classList.add("hidden");
      card.classList.add("open");
    });
  </script>
</body>
</html>
